# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#package-ecosystem-
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docker-actions:
        patterns: ["docker/*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"